<p-progressSpinner *ngIf="loading" ariaLabel="loading"></p-progressSpinner>
<div class="flex">
    <div *ngFor="let val of sbsWithMarkets" class="ml-5">
        <div>
            <img src="{{getSbImageRoute(val.sportsbook_id)}}" alt="{{val.sportsbook_id}}" width="50px" height="20px">
        </div>
        <div class="flex">
            <input type="text" pInputText [(ngModel)]="val.new_market_name" />
            <span>&nbsp;</span>
            <p-button [disabled]="updating" (click)="addMarket(val.new_market_name, val.sportsbook_id)" label="Add" />
        </div>
        <p-table [value]="val.markets">
            <ng-template pTemplate="header">
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-market>
                <tr>
                    <td>{{ market.id }}</td>
                    <td>{{ market.name }}</td>
                    <td>
                        <p-button icon="pi pi-trash" [disabled]="updating" (click)="removeMarket(market.id)" severity="danger" />
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
<p-toast></p-toast>
