<div *ngIf="!isLoggedIn()" class="card">
    Go to login
</div>
<div *ngIf="isLoggedIn()" class="card">
    <i *ngIf="gettingErrors" class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
    <p-card *ngFor="let error of errors" header="{{error.created}}">
        <p class="m-0">
            {{error.message}}
        </p>
    </p-card>
</div>
