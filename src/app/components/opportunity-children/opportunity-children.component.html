<p-progressSpinner *ngIf="loading" ariaLabel="loading"></p-progressSpinner>
<div *ngIf="!loading">
    <div class="row flex">
        <p-table 
            [value]="opportunities" 
            sortField="parent_name" 
            sortMode="single" 
            rowGroupMode="subheader" 
            groupRowsBy="parent_name" 
            [tableStyle]="{'min-width': '100rem'}">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Description</th>
                        <th>Sport</th>
                        <th>SB</th>
                        <th>Prefered</th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="groupheader" let-model>
                    <tr pRowGroupHeader>
                        <td>
                            <span class="font-bold ml-2">{{model.parent_name}}</span>
                        </td>
                        <td><img src="{{getSportImageRoute(model.sport_id)}}" alt="{{model.sport_id}}" width="50px" height="20px"></td>
                        <td>
                            <img src="{{getSbImageRoute(model.sportsbook_id)}}" alt="{{model.sportsbook_id}}" width="50px" height="20px">
                        </td>
                        <td>
                            <i *ngIf="model.parent_prefered" class="pi pi-check" style="color: green"></i>
                            <i *ngIf="!model.parent_prefered" class="pi pi-times" style="color: red"></i>    
                        </td>
                        <td>
                            <p-button *ngIf="model.parent_prefered" (click)="changePreferedParent(model)" [disabled]="deleting" styleClass="p-button-danger">Unset</p-button>
                            <p-button *ngIf="!model.parent_prefered" (click)="changePreferedParent(model)" [disabled]="deleting" styleClass="p-button-success">Set</p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-model let-rowIndex="rowIndex">
                    <tr>
                        <td>{{model.opportunity.description}}</td>
                        <td><img src="{{getSportImageRoute(model.opportunity.sport_id)}}" alt="{{model.opportunity.sport_id}}" width="50px" height="20px"></td>
                        <td><img src="{{getSbImageRoute(model.opportunity.sportsbook_id)}}" alt="{{model.opportunity.sportsbook_id}}" width="50px" height="20px"></td>
                        <td></td>
                        <td>
                            <p-button (click)="removeChild(model.opportunity.id)" [disabled]="deleting" styleClass="p-button-danger">Remove</p-button>
                        </td>
                    </tr>
                </ng-template>
        </p-table>
    </div>
</div>
<p-toast></p-toast>
