<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div>
                    <label for="name" class="block text-900 text-xl font-medium mb-2">Name</label>
                    <input id="name" type="text" placeholder="Name" pInputText [(ngModel)]="name" class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="password" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Password" [feedback]="false" [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>

                    <div class="flex">
                        <button pButton pRipple label="Sign In" class="w-full p-3 text-xl" [disabled]="processing" (click)="login()"></button>
                        <i *ngIf="processing" class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<p-toast></p-toast>
