<div *ngIf="!loading">
    <p-button [disabled]="importing || updating" (click)="import()" label="Import"></p-button>
    <i *ngIf="importing" class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
    <p-table 
    #dt1
    [value]="events" 
    [(selection)]="selectedEvents" 
    dataKey="id" 
    [scrollable]="true" 
    scrollHeight="300px"
    [globalFilterFields]="['description']">
        <ng-template pTemplate="caption">
            <div class="flex">
                <span class="p-input-icon-left ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="filterGlobal($event)" placeholder="Search keyword" />
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                <th>Action</th>
                <th>Time</th>
                <th>Description</th>
                <th>Sport</th>
                <th>Sportsbook</th>
                <th>Availabe In</th>
                <th># markets</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-event>
            <tr>
                <td>
                    <p-tableCheckbox [value]="event" />
                </td>
                <td>
                    <p-button (click)="open_opportunity_dialog(event)" icon="pi pi-plus" [rounded]="true" severity="success" ></p-button>
                </td>
                <td>{{ event.time }}</td>
                <td>{{ event.description }}</td>
                <td><img src="{{getSportImageRoute(event.sport_id)}}" alt="{{event.sport_id}}" width="50px" height="20px"></td>
                <td><img src="{{getSbImageRoute(event.sportsbook_id)}}" alt="{{event.sportsbook_id}}" width="50px" height="20px"></td>
                <td class="flex">
                    <img class="mr-1" *ngFor="let id of event.available_sportsbooks" src="{{getSbImageRoute(id)}}" alt="{{id}}" width="50px" height="20px">
                </td>
                <td>{{ event.price_count }}</td>
            </tr>
        </ng-template>
    </p-table>
    <br>
    <div class="button-div">
        <p-button [disabled]="updating || importing" (click)="update_events()" label="Update" severity="success" styleClass="p-button-success"></p-button>
        <i *ngIf="updating" class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
    </div>
</div>
<p-progressSpinner *ngIf="loading" ariaLabel="loading"></p-progressSpinner>
<div *ngIf="showOpportunityDialog">
    <p-dialog 
        [header]="selectedEvent.description" 
        [modal]="true" 
        [(visible)]="showOpportunityDialog" 
        [style]="{ width: '70%'}" 
        [maximizable]="true">
        <app-opportunity-dialog [event_pk]="selectedEvent.id"></app-opportunity-dialog>
    </p-dialog>
</div>
