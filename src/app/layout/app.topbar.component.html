<div class="layout-topbar flex" style="justify-content: space-between;">
    <div class="flex">
        <a class="layout-topbar-logo" routerLink="">
            <span>Web Scraping Client</span>
        </a>
        <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
            <i class="pi pi-bars"></i>
        </button>
    </div>
    <div>
        <p-button icon="pi pi-sign-out" [rounded]="true" [text]="true" (onClick)="confirmLogout($event)"/>
        <p-confirmDialog />
    </div>
</div>
